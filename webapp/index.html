<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Автомойка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --text:var(--tg-theme-text-color,#222);
  --btn:var(--tg-theme-button-color,#3390ec);
  --btn-text:var(--tg-theme-button-text-color,#fff);
  --hint:var(--tg-theme-hint-color,#999);
  --card:var(--tg-theme-secondary-bg-color,#f1f1f1);
  --radius:12px;
}
body{
  font-family:-apple-system,Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  padding:16px;padding-bottom:80px;
  min-height:100vh;
}
h1{font-size:22px;margin-bottom:16px;text-align:center}
h2{font-size:18px;margin-bottom:12px}
.screen{display:none}
.screen.active{display:block}

/* Service cards */
.svc-card{
  background:var(--card);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;transition:transform .1s;
}
.svc-card:active{transform:scale(.97)}
.svc-name{font-weight:600;font-size:15px}
.svc-meta{color:var(--hint);font-size:13px;margin-top:2px}
.svc-price{font-weight:700;font-size:16px;color:var(--btn);white-space:nowrap}

/* Calendar */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-nav{
  background:var(--btn);color:var(--btn-text);
  border:none;border-radius:50%;width:36px;height:36px;
  font-size:18px;cursor:pointer;
}
.cal-nav:active{opacity:.7}
.cal-month{font-size:17px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-wd{font-size:12px;color:var(--hint);padding:4px 0}
.cal-day{
  padding:8px 0;border-radius:8px;cursor:pointer;
  font-size:14px;transition:background .15s;
}
.cal-day:hover{background:var(--card)}
.cal-day.today{font-weight:700;color:var(--btn)}
.cal-day.past{color:var(--hint);opacity:.4;cursor:default}
.cal-day.empty{cursor:default}

/* Slots */
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot-btn{
  background:var(--btn);color:var(--btn-text);
  border:none;border-radius:8px;padding:12px 0;
  font-size:14px;font-weight:600;cursor:pointer;
}
.slot-btn:active{opacity:.7}

/* Confirm */
.confirm-card{
  background:var(--card);border-radius:var(--radius);
  padding:20px;margin-bottom:20px;
}
.confirm-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.confirm-label{color:var(--hint)}
.confirm-value{font-weight:600}

/* Reminder */
.remind-option{
  background:var(--card);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:8px;
  cursor:pointer;font-size:15px;text-align:center;
  font-weight:500;
}
.remind-option:active{transform:scale(.97)}

/* Buttons */
.btn{
  display:block;width:100%;padding:14px;
  border:none;border-radius:var(--radius);
  font-size:16px;font-weight:600;cursor:pointer;
  margin-top:10px;
}
.btn-primary{background:var(--btn);color:var(--btn-text)}
.btn-secondary{background:var(--card);color:var(--text)}
.btn:active{opacity:.8}
.btn:disabled{opacity:.4;cursor:default}

/* Bottom bar */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  padding:12px 16px;background:var(--bg);
  border-top:1px solid var(--card);
}
.bottom-bar .btn{margin:0}

/* Back link */
.back-link{
  display:inline-flex;align-items:center;gap:4px;
  color:var(--btn);font-size:14px;font-weight:500;
  cursor:pointer;margin-bottom:12px;
}
.back-link::before{content:"←";font-size:18px}

/* Success */
.success-icon{font-size:48px;text-align:center;margin:20px 0}
.success-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:8px}
.success-sub{font-size:14px;color:var(--hint);text-align:center;margin-bottom:20px}

/* Bookings list */
.bk-card{
  background:var(--card);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;
}
.bk-header{display:flex;justify-content:space-between;align-items:center}
.bk-title{font-weight:600;font-size:15px}
.bk-time{color:var(--btn);font-weight:600}
.bk-meta{color:var(--hint);font-size:13px;margin-top:4px}
.bk-cancel{
  color:#e53935;font-size:13px;font-weight:500;
  cursor:pointer;margin-top:8px;
}

.loading{text-align:center;padding:40px;color:var(--hint)}
.empty-state{text-align:center;padding:40px;color:var(--hint)}
</style>
</head>
<body>

<!-- SCREEN: Services -->
<div id="screen-services" class="screen active">
  <h1>🚗 Автомойка</h1>
  <h2>Выберите услугу</h2>
  <div id="services-list"></div>
  <div class="bottom-bar">
    <button class="btn btn-secondary" onclick="showBookings()">📋 Мои записи</button>
  </div>
</div>

<!-- SCREEN: Calendar -->
<div id="screen-calendar" class="screen">
  <div class="back-link" onclick="goBack('services')">Назад</div>
  <h2 id="cal-title">Выберите дату</h2>
  <div id="calendar-container"></div>
</div>

<!-- SCREEN: Slots -->
<div id="screen-slots" class="screen">
  <div class="back-link" onclick="goBack('calendar')">Назад</div>
  <h2 id="slots-title">Свободные окна</h2>
  <div id="slots-grid" class="slot-grid"></div>
</div>

<!-- SCREEN: Confirm -->
<div id="screen-confirm" class="screen">
  <div class="back-link" onclick="goBack('slots')">Назад</div>
  <h2>Подтвердите запись</h2>
  <div id="confirm-card" class="confirm-card"></div>
  <button class="btn btn-primary" onclick="submitBooking()">✅ Подтвердить</button>
</div>

<!-- SCREEN: Reminder -->
<div id="screen-reminder" class="screen">
  <h2>⏰ Напоминание</h2>
  <p style="margin-bottom:16px;color:var(--hint)">Хотите получить напоминание перед мойкой?</p>
  <div class="remind-option" onclick="skipReminder()">🚫 Нет, спасибо</div>
  <div class="remind-option" onclick="setReminder(30)">За 30 минут</div>
  <div class="remind-option" onclick="setReminder(60)">За 1 час</div>
  <div class="remind-option" onclick="setReminder(120)">За 2 часа</div>
  <div class="remind-option" onclick="setReminder(1440)">За день</div>
</div>

<!-- SCREEN: Success -->
<div id="screen-success" class="screen">
  <div class="success-icon">✅</div>
  <div class="success-title">Вы успешно записаны!</div>
  <div id="success-details" class="success-sub"></div>
  <button class="btn btn-primary" onclick="showBookings()">📋 Мои записи</button>
  <button class="btn btn-secondary" onclick="goBack('services')">🔙 На главную</button>
</div>

<!-- SCREEN: My Bookings -->
<div id="screen-bookings" class="screen">
  <div class="back-link" onclick="goBack('services')">Назад</div>
  <h2>📋 Мои записи</h2>
  <div id="bookings-list"></div>
  <div class="bottom-bar">
    <button class="btn btn-primary" onclick="goBack('services')">📝 Новая запись</button>
  </div>
</div>

<!-- SCREEN: Loading -->
<div id="screen-loading" class="screen">
  <div class="loading">Загрузка...</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const API = location.origin;
const initData = tg.initData;

let state = {
  services: [],
  selectedService: null,
  selectedDate: null,
  selectedSlot: null,
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth() + 1,
  lastBookingId: null,
  remindBefore: 0,
};

const MONTHS = ['','Январь','Февраль','Март','Апрель','Май','Июнь',
  'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

// ── Screen management ──────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function goBack(screen) {
  showScreen(screen);
  if (screen === 'services') loadServices();
}

// ── API calls ──────────────────────────────────
async function apiFetch(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...opts.headers },
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.detail || r.statusText);
  }
  return r.json();
}

// ── Services ───────────────────────────────────
async function loadServices() {
  showScreen('loading');
  try {
    state.services = await apiFetch('/api/services');
    const list = document.getElementById('services-list');
    list.innerHTML = state.services.map(s => {
      const dur = s.slots * 40;
      return `<div class="svc-card" onclick="selectService(${s.id})">
        <div><div class="svc-name">${s.name}</div>
        <div class="svc-meta">${dur} мин</div></div>
        <div class="svc-price">${s.price} ₽</div>
      </div>`;
    }).join('');
    showScreen('services');
  } catch (e) {
    document.getElementById('services-list').innerHTML =
      `<div class="empty-state">Ошибка загрузки: ${e.message}</div>`;
    showScreen('services');
  }
}

function selectService(id) {
  state.selectedService = state.services.find(s => s.id === id);
  renderCalendar();
  showScreen('calendar');
}

// ── Calendar ───────────────────────────────────
function renderCalendar() {
  const y = state.calYear, m = state.calMonth;
  document.getElementById('cal-title').textContent =
    `${state.selectedService.name} — ${MONTHS[m]} ${y}`;

  const first = new Date(y, m - 1, 1);
  const startWd = (first.getDay() + 6) % 7; // Mon=0
  const daysInMonth = new Date(y, m, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  let html = '<div class="cal-header">';
  html += `<button class="cal-nav" onclick="calNav(-1)">‹</button>`;
  html += `<span class="cal-month">${MONTHS[m]} ${y}</span>`;
  html += `<button class="cal-nav" onclick="calNav(1)">›</button>`;
  html += '</div>';

  html += '<div class="cal-grid">';
  WEEKDAYS.forEach(w => html += `<div class="cal-wd">${w}</div>`);

  for (let i = 0; i < startWd; i++) html += '<div class="cal-day empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(y, m - 1, d);
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isPast = dt < today;
    const isToday = dt.getTime() === today.getTime();
    const cls = ['cal-day'];
    if (isPast) cls.push('past');
    if (isToday) cls.push('today');
    const click = isPast ? '' : `onclick="selectDate('${iso}')"`;
    html += `<div class="${cls.join(' ')}" ${click}>${d}</div>`;
  }

  html += '</div>';
  document.getElementById('calendar-container').innerHTML = html;
}

function calNav(dir) {
  state.calMonth += dir;
  if (state.calMonth < 1) { state.calMonth = 12; state.calYear--; }
  if (state.calMonth > 12) { state.calMonth = 1; state.calYear++; }
  renderCalendar();
}

async function selectDate(iso) {
  state.selectedDate = iso;
  showScreen('loading');
  try {
    const data = await apiFetch(`/api/slots/${state.selectedService.id}/${iso}`);
    if (!data.slots.length) {
      alert('Нет свободных окон на эту дату');
      showScreen('calendar');
      return;
    }
    const d = new Date(iso);
    const wd = WEEKDAYS[(d.getDay() + 6) % 7];
    document.getElementById('slots-title').textContent =
      `${wd}, ${d.toLocaleDateString('ru-RU')} • ${state.selectedService.name}`;

    const grid = document.getElementById('slots-grid');
    grid.innerHTML = data.slots.map(t =>
      `<button class="slot-btn" onclick="selectSlot('${t}')">${t}</button>`
    ).join('');
    showScreen('slots');
  } catch (e) {
    alert('Ошибка: ' + e.message);
    showScreen('calendar');
  }
}

// ── Slots ──────────────────────────────────────
function selectSlot(time) {
  state.selectedSlot = time;
  const svc = state.selectedService;
  const [sh, sm] = time.split(':').map(Number);
  const endMin = sh * 60 + sm + svc.slots * 40;
  const endTime = `${String(Math.floor(endMin / 60)).padStart(2,'0')}:${String(endMin % 60).padStart(2,'0')}`;

  const d = new Date(state.selectedDate);
  const wd = WEEKDAYS[(d.getDay() + 6) % 7];

  document.getElementById('confirm-card').innerHTML = `
    <div class="confirm-row"><span class="confirm-label">Услуга</span><span class="confirm-value">${svc.name}</span></div>
    <div class="confirm-row"><span class="confirm-label">Дата</span><span class="confirm-value">${wd}, ${d.toLocaleDateString('ru-RU')}</span></div>
    <div class="confirm-row"><span class="confirm-label">Время</span><span class="confirm-value">${time} – ${endTime}</span></div>
    <div class="confirm-row"><span class="confirm-label">Стоимость</span><span class="confirm-value">${svc.price} ₽</span></div>
  `;
  showScreen('confirm');
}

// ── Booking ────────────────────────────────────
async function submitBooking() {
  showScreen('loading');
  try {
    const result = await apiFetch('/api/book', {
      method: 'POST',
      body: JSON.stringify({
        init_data: initData,
        service_id: state.selectedService.id,
        booking_date: state.selectedDate,
        slot_start: state.selectedSlot,
        remind_before: 0,
      }),
    });
    state.lastBookingId = result.booking_id;
    showScreen('reminder');
  } catch (e) {
    alert('Ошибка: ' + e.message);
    showScreen('services');
  }
}

// ── Reminder ───────────────────────────────────
async function skipReminder() {
  await finishBooking(0);
}

async function setReminder(minutes) {
  await finishBooking(minutes);
}

async function finishBooking(remindBefore) {
  // Update reminder via DB (re-book with remind)
  if (remindBefore > 0 && state.lastBookingId) {
    try {
      await apiFetch('/api/set_reminder', {
        method: 'POST',
        body: JSON.stringify({
          init_data: initData,
          booking_id: state.lastBookingId,
          remind_before: remindBefore,
        }),
      });
    } catch (e) { /* ignore - booking still confirmed */ }
  }

  const svc = state.selectedService;
  const [sh, sm] = state.selectedSlot.split(':').map(Number);
  const endMin = sh * 60 + sm + svc.slots * 40;
  const endTime = `${String(Math.floor(endMin / 60)).padStart(2,'0')}:${String(endMin % 60).padStart(2,'0')}`;
  const d = new Date(state.selectedDate);
  const wd = WEEKDAYS[(d.getDay() + 6) % 7];

  const labels = {30:'30 минут',60:'1 час',120:'2 часа',1440:'день'};
  const remindText = remindBefore > 0
    ? `⏰ Напоминание: за ${labels[remindBefore] || remindBefore + ' мин'}`
    : '';

  document.getElementById('success-details').innerHTML = `
    🆔 Запись #${state.lastBookingId}<br>
    🚿 ${svc.name}<br>
    📅 ${wd}, ${d.toLocaleDateString('ru-RU')}<br>
    🕐 ${state.selectedSlot} – ${endTime}<br>
    💰 ${svc.price} ₽
    ${remindText ? '<br>' + remindText : ''}
  `;
  showScreen('success');
}

// ── My Bookings ────────────────────────────────
async function showBookings() {
  showScreen('loading');
  try {
    const bookings = await apiFetch(`/api/mybookings?init_data=${encodeURIComponent(initData)}`);
    const list = document.getElementById('bookings-list');

    if (!bookings.length) {
      list.innerHTML = '<div class="empty-state">Нет активных записей</div>';
    } else {
      list.innerHTML = bookings.map(b => {
        const d = new Date(b.booking_date);
        const wd = WEEKDAYS[(d.getDay() + 6) % 7];
        return `<div class="bk-card">
          <div class="bk-header">
            <div class="bk-title">${b.service_name}</div>
            <div class="bk-time">${b.slot_start} – ${b.slot_end}</div>
          </div>
          <div class="bk-meta">📅 ${wd}, ${d.toLocaleDateString('ru-RU')} • 💰 ${b.price} ₽</div>
          <div class="bk-cancel" onclick="cancelBooking(${b.id})">❌ Отменить запись</div>
        </div>`;
      }).join('');
    }
    showScreen('bookings');
  } catch (e) {
    alert('Ошибка: ' + e.message);
    showScreen('services');
  }
}

async function cancelBooking(id) {
  if (!confirm('Отменить запись?')) return;
  try {
    await apiFetch('/api/cancel', {
      method: 'POST',
      body: JSON.stringify({ init_data: initData, booking_id: id }),
    });
    showBookings();
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

// ── Init ───────────────────────────────────────
loadServices();
</script>
</body>
</html>
